<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Interactive Webpage</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f8ff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      color: #333;
    }
    button {
      background-color: #008cba;
      border: none;
      color: white;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #005f6a;
    }
    #message {
      margin-top: 20px;
      font-size: 18px;
      color: #007700;
    }
  </style>
</head>
<body>

  <h1>Welcome to My Webpage</h1>
  <button id="myButton">Click Me!</button>
  <div id="message"></div>

  <script>
    const button = document.getElementById('myButton');
    const message = document.getElementById('message');

    button.addEventListener('click', () => {
      message.textContent = 'Hello! You clicked the button.';
      button.style.backgroundColor = '#4CAF50'; // change button color on click
    });
  </script>

</body>
</html>
